{% extends "base.html" %}
{% block title %}Add Flight{% endblock %}
{% block content %}

<div class="form-container dark-theme">
    <h1 class="page-title yellow-text">Add Flight</h1>

    {% if error %}
        <div class="error-box">{{ error }}</div>
    {% endif %}

    <form method="post" class="flight-form dark-card">

        <div class="form-row">
            <label>Flight Number</label>
            <input type="text" name="flight_no" required>
        </div>

        <div class="form-row">
            <label>Airline ID</label>
            <input type="text" name="airline" required>
        </div>

        <div class="form-row">
            <label>Departure Airport ID</label>
            <input type="text" name="departure" required>
        </div>

        <div class="form-row">
            <label>Arrival Airport ID</label>
            <input type="text" name="arrival_airport_id" required>
        </div>

        <div class="form-row">
            <label>Departure Time</label>
            <input type="datetime-local" name="departure_time" required>
        </div>

        <div class="form-row">
            <label>Arrival Time</label>
            <input type="datetime-local" name="arrival_time" required>
        </div>

        <div class="form-row">
            <label>Price</label>
            <input type="number" step="0.01" name="price" required>
        </div>

        <div class="form-row">
            <label>Seats</label>
            <input type="number" name="seats" required>
        </div>

        <div class="form-row">
            <label>Status</label>
            <select name="status">
                <option value="active">Active</option>
                <option value="cancelled">Cancelled</option>
            </select>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn-yellow">Add Flight</button>
            <a href="{{ url_for('flights_list') }}" class="cancel-link">Cancel</a>
        </div>

    </form>
</div>

{% endblock %}
